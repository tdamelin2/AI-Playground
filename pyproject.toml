[project]
name = "ai-island"
version = "0.1.0"
description = "AI Island: four AI players on a black-and-white island"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=2.3.0",
    "google-genai>=2.34.0",
    "mistralai>=3.6.0",
    "ollama>=0.6.3",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
    "pygame-ce>=2.5.8",
    "pygame-gui>=0.6.14",
    "python-dotenv>=1.2.4",
    "tomlkit>=0.15.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_island"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (full game year)"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
