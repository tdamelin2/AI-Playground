# One full-window layer drawn last (both palettes): night/dusk/dawn darkness plus a little for weather.
[light]
night_color = "#0b1030"   # deep blue-black
night_alpha = 150         # 0-255: how dark full night is (readable, not black)
rain_alpha = 30           # extra darkness in rain
storm_alpha = 60          # extra darkness in a storm

# ---------------------------------------------------------------- activity bubbles
# What each activity shows in its bubble: an [items] key (the picture) or "word" (the text from
# [activity_words]). Every activity kind (all action kinds, the villager jobs, idle and sleeping)
# needs an entry. These tables add no sprites.
[activity_icons]
