# ---------------------------------------------------------------- colours (colour mode)
# Every colour used on a Kenney tile or a code drawing comes from the 8 Kenney palette colours:
# the 7 opaque colours of colored-transparent.png plus the background of colored.png.
[colors]
background = "#472d3c"     # window and off-map colour (Kenney dark plum)
kenney_palette = ["#472d3c", "#cfc6b8", "#bf7958", "#e6482e", "#3cacd7", "#7a444a", "#38d973", "#f4b41b"]
code_light = "#cfc6b8"     # replaces white in code drawings (cream)
drought_ground = "#a39a4a" # grass ground in drought: dry olive-yellow
autumn = ["#f4b41b", "#e6482e", "#bf7958"]  # replace green in autumn variants: yellow, orange-red, rust
autumn_items = ["tree", "great_tree", "berries", "herbs", "healing_herbs", "mild_poison"]  # trees and bush-like plants
flash = "#ffd23f"          # frame blinked around the tile of an important event (bright yellow, stands out on every ground)
wanderer = "#cfc6b8"       # names, dots and ring of villagers who follow nobody (neutral cream: belongs to no player colour)

