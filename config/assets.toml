# Asset mapping: every docs/gameplay.md asset-list item -> a tile in one of two sheets, or `code`.
# Tile (col,row) is read at x = col*17, y = row*17 in its sheet (16 px tile + 1 px gap).
# Sources: "kenney" (Kenney 1-Bit Pack, colour sheet), "tiny_creatures" (Kenney Tiny Creatures
# tilemap, used for the wild animals) and "code" (drawn by ai_island.observer.code_art).
# Palette "color" shows the colours; "mono" is the old black-and-white look (a switch, not a fallback).

palette = "color"

[sheets.kenney]
path = "assets/kenney_1bit/Tilesheet/colored-transparent.png"
tile_size = 16
gap = 1
columns = 49
rows = 22

[sheets.tiny_creatures]
path = "assets/tiny_creatures/tiny-creatures/Tilemap/tilemap.png"
tile_size = 16
gap = 1
columns = 10
rows = 18

# Every key below that is drawn in code is also listed in [missing] at the end.

