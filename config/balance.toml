# Rates and timings for the island ecology. Each value says why it is what it is.

extinction_delay_ticks = 20160   # a wiped-out animal stays away one season before returning
summary_interval_ticks = 1440    # one day summary event per game day

[movement]
movement_step_ticks = 1          # movement is checked every game minute; steps end exactly on a tick (must be 1 in this phase)
max_start_share = 0.25           # at most a quarter of one kind starts a step in the same minute, so herds never move in lockstep

[trees]
regrow_ticks = 10080             # a cut tree regrows after a week
overcut_threshold = 0.5          # below half the original trees in an area, nothing regrows

[stone]
rocky_stone = 15                 # loose stone on a rocky tile: enough for a first pickaxe
quarry_stone = 60                # each quarry tile holds a lot; stone never regrows

[water]
spring_output = 10.0             # water a spring gives per use
lake_output = 40.0               # the lake gives more
[water.multiplier]
clear = 1.0                      # normal water
rain = 1.0                       # rain does not change the supply
storm = 1.0                      # storms do not change the supply
drought = 0.4                    # drought cuts fresh water to 40 percent

[crops]
