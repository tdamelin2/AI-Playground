# World layout and what exists on the island. Rates and timings live in balance.toml.

[clock]
ticks_per_day = 1440      # one tick is one game minute
days_per_week = 7
days_per_season = 14      # 2 weeks per season, 4 seasons: a year is 80,640 ticks
night_start_hour = 20     # night runs from 20:00 ...
night_end_hour = 6        # ... to 06:00
dawn_minutes = 60         # light fades in over the hour after night ends (06:00-07:00)
dusk_minutes = 60         # light fades out over the hour before night starts (19:00-20:00), so it is fully dark when night begins

[map]
width = 80
height = 80
coast_width = 2           # water ring around the island
sand_width = 1            # beach just inside the coast
home_size = 18            # each home plot is 18 x 18
home_margin = 4           # distance from the map edge to a home plot (must exceed coast + sand)
centre_size = 26          # the contested centre is 26 x 26, in the middle
buffer_forest_clumps = 10 # forest patches in the neutral buffer land
buffer_forest_radius = 3
buffer_forest_density = 0.8
buffer_rocky_tiles = 12   # loose-stone tiles in the buffer
buffer_stray_trees = 30

[home]
tree_tiles = 36           # the small forest of a home plot
spring_tiles = 1
farmland_width = 4
farmland_height = 3
rocky_tiles = 3

[centre]
forest_clumps = 9         # the large forest
forest_radius = 5
forest_density = 0.85
farmland_width = 8        # the best farmland
farmland_height = 6
lake_width = 7
lake_height = 5
quarry_size = 3           # the quarry is a 3 x 3 block
rocky_tiles = 8

[land]
pool_zones = ["buffer", "centre"]   # zones whose free land tiles form the unclaimed-land pool

[terrain]
# Water tiles cannot be walked on. Every other terrain has a cost for entering it.
impassable = ["spring", "lake", "coast"]

[terrain.cost]
grass = 1.0
sand = 1.2
tree = 2.0
stump = 1.3
farmland_empty = 1.1
farmland_planted = 1.1
farmland_growing = 1.1
farmland_ready = 1.1
farmland_failed = 1.1
rocky = 1.5
rocky_depleted = 1.0
quarry = 1.5
quarry_depleted = 1.0

[weather]
interval_ticks = 720      # a new weather draw every half day (divides the season length)

[weather.odds.spring]
clear = 0.55
rain = 0.35
storm = 0.10
drought = 0.0

[weather.odds.summer]
clear = 0.60
rain = 0.15
storm = 0.10
drought = 0.15

[weather.odds.autumn]
clear = 0.50
rain = 0.35
storm = 0.15
drought = 0.0

[weather.odds.winter]
clear = 0.50
rain = 0.30
storm = 0.20
drought = 0.0

